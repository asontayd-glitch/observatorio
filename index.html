<title>Observatorio de Sentencias</title>

<style>
/* Layout: mesa de consulta institucional; franja azul marino, selector de tribunal, resumen y luego fichas */
:root{--bg:#fff;--panel:#f4f7fb;--sky:#e4f1fa;--fg:#14233a;--muted:#54657c;--line:#d6dfe9;--navy:#12305c;--on-navy:#fff;--gold:#b98a1e;--gold-text:#80600f;--bar:#12305c;--warn-bg:#fdf4dc;--warn-fg:#6d5208;--display:"Source Serif 4",Georgia,"Times New Roman",serif;--body:Arial,Helvetica,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1827;--panel:#16233a;--sky:#17324a;--fg:#e8eef6;--muted:#a4b3c6;--line:#2c3d57;--navy:#0a1a33;--on-navy:#f3f6fb;--gold:#dcb24a;--gold-text:#e6c063;--bar:#7fa8dc;--warn-bg:#3a2f10;--warn-fg:#f0d78c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1827;--panel:#16233a;--sky:#17324a;--fg:#e8eef6;--muted:#a4b3c6;--line:#2c3d57;--navy:#0a1a33;--on-navy:#f3f6fb;--gold:#dcb24a;--gold-text:#e6c063;--bar:#7fa8dc;--warn-bg:#3a2f10;--warn-fg:#f0d78c;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--navy);color:var(--on-navy);border-bottom:3px solid var(--gold)}
header .wrap{padding-block:22px 18px;display:flex;flex-direction:column;gap:6px}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0}
h1{font-size:30px;line-height:1.15}
.sub{margin:0;font-size:14px;max-width:72ch;opacity:.92}
nav{border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav .wrap{display:flex;gap:4px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:600 14px var(--body);padding:12px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--gold)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main .wrap{padding-block:24px 48px;display:flex;flex-direction:column;gap:24px}
.notice{background:var(--warn-bg);color:var(--warn-fg);padding:12px 14px;border-radius:6px;font-size:14px}.notice p{margin:0}
.scope{display:flex;flex-wrap:wrap;gap:8px}
.scope button{font:600 13px var(--body);padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.scope button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--panel);padding:14px;border-radius:6px}
.kpi b{display:block;font:600 30px/1.1 var(--display);font-variant-numeric:tabular-nums}.kpi span{font-size:13px;color:var(--muted)}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 32px}
.chart h3{font-size:18px;margin-bottom:10px}
.row{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:10px;align-items:center;width:100%;background:none;border:0;color:inherit;font:inherit;padding:5px 2px;text-align:left;cursor:pointer;border-radius:4px}
.row:hover{background:var(--panel)}.row .lab{font-size:13px}
.track{display:flex;align-items:center;gap:8px;min-width:0}
.bar{height:12px;background:var(--bar);border-radius:0 4px 4px 0;min-width:3px}
.val{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--muted);margin:0}
.filters{display:grid;grid-template-columns:2fr repeat(4,1fr) auto;gap:10px;align-items:end}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
input,select{font:14px var(--body);padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);width:100%}
.btn{font:600 14px var(--body);padding:9px 12px;border:1px solid var(--navy);border-radius:4px;background:var(--navy);color:var(--on-navy);cursor:pointer}
.btn.alt{background:none;color:var(--fg);border-color:var(--line)}.btn:disabled{opacity:.45;cursor:default}
.toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}.toolbar strong{font-variant-numeric:tabular-nums}
.fichas{display:flex;flex-direction:column;border-top:1px solid var(--line)}
details{border-bottom:1px solid var(--line)}
summary{cursor:pointer;padding:12px 4px;display:grid;grid-template-columns:58px minmax(0,1fr) 92px 190px;gap:12px;align-items:center;list-style:none}
summary::-webkit-details-marker{display:none}summary:hover{background:var(--panel)}
.court{font-size:12px;font-weight:700;color:var(--gold-text)}
.main-t{min-width:0}.exp{font-weight:700;font-variant-numeric:tabular-nums}.tp{display:block;font-size:13px;color:var(--muted)}
.date{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{justify-self:start;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid var(--line);background:var(--panel)}
.pill.nc{font-weight:400;color:var(--muted);border-style:dashed;background:none}
.body{padding:2px 4px 16px;display:flex;flex-direction:column;gap:10px;max-width:84ch}.body p{margin:0}
dl{display:grid;grid-template-columns:170px minmax(0,1fr);gap:4px 12px;margin:0;font-size:14px}dt{color:var(--muted)}dd{margin:0}
.alert{font-size:13px;background:var(--warn-bg);color:var(--warn-fg);padding:6px 10px;border-radius:4px}
.body a,.note a{color:var(--gold-text);font-weight:700}
.pager{display:flex;justify-content:center;align-items:center;gap:12px;font-size:14px}
.sky{background:var(--sky);padding:16px;border-radius:6px;display:flex;flex-direction:column;gap:6px}.sky p{margin:0;max-width:75ch}
.tablebox{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px;min-width:620px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:12px;color:var(--muted)}td.n{font-weight:700;font-variant-numeric:tabular-nums}
.gloss{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 32px}.gloss h3{font-size:17px}.gloss p{margin:2px 0 0;font-size:14px}
.prose{display:flex;flex-direction:column;gap:12px;max-width:74ch}.prose p,.prose ul{margin:0}
#csvBox{width:100%;height:120px;font:12px monospace}
@media(max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.charts,.gloss{grid-template-columns:minmax(0,1fr)}.filters{grid-template-columns:minmax(0,1fr)}summary{grid-template-columns:44px minmax(0,1fr);gap:4px 10px}summary .date{grid-column:2}summary .pill{grid-column:2}dl{grid-template-columns:minmax(0,1fr)}dd{margin-bottom:6px}h1{font-size:25px}}
</style>

 el.innerHTML=`<div class="sky"><h2 style="font-size:20px">Tres fallos contestes</h2><p>El artículo 43 de la Ley de Amparo, Exhibición Personal y de Constitucionalidad establece que la interpretación contenida en las sentencias de la Corte sienta doctrina legal al haber tres fallos contestes. La Corte puede separarse de su jurisprudencia razonando la innovación.</p></div>
 <p class="prose">Este cuadro cubre por ahora los ${LAB.length} fallos laborales, que tienen tema y motivo registrados. Las ${D.filter(d=>d.c==="CC"&&d.src!=="vLex").length} fichas nuevas de la Corte de Constitucionalidad todavía no tienen criterio extraído. La marca de revisión es solo una alerta: confirmar doctrina legal exige leer los considerandos.</p>
 <div class="tablebox"><table><thead><tr><th>Tema</th><th>Sentido</th><th>Motivo registrado</th><th>Fallos</th><th>Expedientes</th><th>Estado</th></tr></thead><tbody>${rows.map(([k,v])=>{const[a,b,c]=k.split("|");return `<tr><td>${esc(a)}</td><td>${esc(b)}</td><td>${esc(c)}</td><td class="n">${v.length}</td><td>${v.join(", ")}</td><td>${v.length>=3?"<b>Para revisar</b>":"Menos de 3"}</td></tr>`}).join("")}</tbody></table></div>`}
function tribunales(){el.innerHTML=`<div class="prose"><h2 style="font-size:22px">Corte de Constitucionalidad</h2><p>Es el tribunal permanente de jurisdicción privativa cuya función esencial es la defensa del orden constitucional (Constitución Política, art. 268). Se integra con cinco magistrados titulares, cada uno con su suplente, y duran cinco años en el cargo (art. 269). Sus funciones están en el art. 272.</p>
 <h2 style="font-size:22px">Corte Suprema de Justicia</h2><p>Las fichas provienen de dos cámaras. La Cámara de Amparo y Antejuicio resuelve amparos, y la Cámara Penal resuelve recursos de casación.</p>
 <h2 style="font-size:22px">Corte Interamericana de Derechos Humanos</h2><p>Es el tribunal del sistema interamericano que resuelve casos sobre la Convención Americana sobre Derechos Humanos. Las fichas incluyen casos contra Guatemala y otros Estados.</p>
 <div class="sky"><h3 style="font-size:17px">Pendiente de cargar</h3><p>La lista de magistrados por período aún falta verificarla en una fuente oficial.</p></div></div>`}
const GL=[["Amparo","Garantía constitucional que protege contra amenazas o violaciones a los derechos, o los restaura cuando ya ocurrieron (Constitución Política, art. 265)."],["Casación","Recurso ante la Cámara Penal de la Corte Suprema de Justicia contra determinadas resoluciones de las salas de apelaciones, por motivos de forma o de fondo."],["Procedente e improcedente","Forma en que la Cámara Penal indica si acoge o no el recurso de casación."],["Otorga y deniega","Forma en que el tribunal de amparo concede o niega la protección solicitada."],["Postulante","Quien promueve la acción de amparo."],["Acto reclamado","La resolución o actuación contra la que se pide amparo."],["Apelación de sentencia de amparo","Revisión por la Corte de Constitucionalidad de lo resuelto en amparo por el tribunal de primer grado."],["Doctrina legal","Interpretación de la Corte que debe respetarse por los tribunales al haber tres fallos contestes (Ley de Amparo, art. 43)."],["Reinstalación","Orden de reincorporar al trabajador despedido sin autorización judicial cuando esta era necesaria."],["Renglón 029","Renglón presupuestario de servicios técnicos o profesionales. Varios fallos laborales discuten si encubre una relación laboral."],["Tutelaridad","Principio por el que las leyes de trabajo protegen al trabajador (Constitución Política, art. 103)."],["In dubio pro operario","En caso de duda sobre normas de trabajo, se interpreta en el sentido más favorable al trabajador (Constitución Política, art. 106)."]];
function glosario(){el.innerHTML=`<div class="gloss">${GL.map(([a,b])=>`<div><h3>${a}</h3><p>${b}</p></div>`).join("")}</div>`}
function metodo(){el.innerHTML=`<div class="prose note"><h2 style="font-size:22px">De dónde salen los datos</h2>
 <ul><li><b>Recopilación de sentencias</b> de la Corte Suprema de Justicia, la Corte de Constitucionalidad y la Corte Interamericana de Derechos Humanos: ${META.pub} fichas.</li><li><b>vLex Guatemala:</b> ${LAB.length} fallos laborales.</li></ul>
 <h3 style="font-size:18px">Cómo se extrajo</h3><ul><li><b>Sentido:</b> primera declaración de la parte resolutiva. «Mixto» indica un mismo fallo con recursos procedentes e improcedentes. «No consta» o «Revisar» indica que no se pudo determinar (${META.sinSentido} fichas).</li><li><b>Fecha:</b> la del encabezado o del texto. ${META.sinFechaCSJ} fichas de la CSJ y ${META.sinFechaCIDH} de la Corte Interamericana quedan sin fecha porque no se encontró en el material recopilado.</li><li><b>Autoridad y motivo:</b> tomados del texto. Una misma sala puede aparecer escrita de varias formas.</li><li><b>Ponente:</b> solo cuando el texto de la CC lo indica.</li></ul>
 <h3 style="font-size:18px">Protección de datos</h3><p>De quien promovió o recurrió se publica el primer nombre y las iniciales de los demás nombres y apellidos. En casos con posibles menores, delitos sexuales o violencia contra la mujer o intrafamiliar se publican solo iniciales. No se publican nombres de víctimas. Estas fichas no incluyen los hechos de cada caso. Una ficha no prueba culpabilidad ni indica el estado actual del proceso.</p>
 <p>Antes de citar un fallo, cotéjalo con la sentencia oficial. Para la Corte de Constitucionalidad usa su <a href="https://consultajur.cc.gob.gt/wcJur/Portal/wfConsJurCC.aspx" target="_blank" rel="noopener">portal de jurisprudencia</a>.</p></div>`}
const VIEWS={tablero,directorio,doctrina,tribunales,glosario,metodo};
function go(v,push=true){if(!VIEWS[v])v="tablero";document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v));VIEWS[v]();if(push)try{history.replaceState(null,"","#"+v)}catch(e){location.hash=v}}
document.querySelector("nav").addEventListener("click",e=>{const b=e.target.closest("button");if(b)go(b.dataset.v)});
el.addEventListener("click",e=>{const r=e.target.closest(".row");if(!r)return;Object.assign(st,{q:"",c:r.dataset.sc||"",s:"",t:"",y:"",extra:null,page:0});const f=r.dataset.f,k=r.dataset.k,h=r.closest(".chart").querySelector("h3").textContent;if(f==="c")st.c=k;else if(f==="s"){st.s=k;if(h.startsWith("Casación"))st.t="Casación";if(h.startsWith("Amparo"))st.t="Amparo"}else if(f==="t")st.t=k;else if(f==="y")st.y=k;else{st.extra=[f,k];if(h.startsWith("Casación"))st.t="Casación"}go("directorio")});
window.addEventListener("hashchange",()=>go(location.hash.slice(1),false));
go(location.hash.slice(1)||"tablero",false);
</script>
